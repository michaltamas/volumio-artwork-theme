<!-- the words (handoff 6a, 6d): the column, used in the desktop face and in the phone sheet -->
<div class="np-lyrics" ng-if="playback.lyricsOn" ng-class="'np-lyrics--' + playback.lyrics.state">
        <div class="np-lyrics__col np-lyrics__col--synced" ng-if="playback.lyrics.state === 'synced'" aw-lyrics-list="playback.lyricsIndex">
          <div class="np-lyrics__stack">
            <div class="np-lyrics__line" ng-repeat="l in playback.lyrics.lines track by $index" data-line="{{$index}}"
                 ng-class="playback.lineClass($index)" ng-click="playback.seekToLine(l)" role="button" tabindex="-1">
              <span class="np-lyrics__mark" aria-hidden="true"></span><span class="np-lyrics__text">{{l.text}}</span>
            </div>
          </div>
        </div>
        <div class="np-lyrics__col np-lyrics__col--plain" ng-if="playback.lyrics.state === 'plain'">
          <div class="np-lyrics__eyebrow mono">LYRICS · LRCLIB</div>
          <div class="np-lyrics__plain"><div class="np-lyrics__line is-plain" ng-repeat="l in playback.lyricsPlainLines track by $index">{{l || '&nbsp;'}}</div></div>
        </div>
        <div class="np-lyrics__col np-lyrics__col--empty" ng-if="playback.lyrics.state === 'none'"><div class="np-lyrics__empty">No lyrics for this track.</div></div>
        <div class="np-lyrics__col np-lyrics__col--loading" ng-if="playback.lyrics.state === 'loading'"><div class="np-lyrics__skeleton"><i></i><i></i><i></i><i></i><i></i></div></div>
        <!-- the source: under the synced words; the plain words name it in their eyebrow instead -->
        <div class="np-lyrics__source mono" ng-if="playback.lyrics.state === 'synced'">LYRICS · LRCLIB</div>
      </div>

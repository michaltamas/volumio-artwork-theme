<div id="browse" class="boxTable" ng-class="{'browsing-album': browse.browseService.info.type === 'album' || browse.browseService.info.type === 'cd', 'browsing-playlist': browse.isPlaylistInfo,'browsing-home': !browse.browseService.isBrowsing && !browse.browseService.isSearching, 'browsing-search': browse.isLandingSearch, 'browsing-artists': browse.currentUri === 'artists://', 'browsing-artist': browse.browseService.info.type === 'artist', 'aw-artist-all': browse.awArtistShowAll || browse.awFilter, 'browsing-list': browse.isPlainList}" browse-scroll-manager>

    <div class="panel panel-default">

      <div class="browse-header-container browse-music__browse-header-container">

        <div  ng-if="!browse.isDedicatedSearchView" id="browsePanelHeading" class="panel-heading browse-header">

          <div class="navButtons pull-left"
               ng-include src="'app/browse/components/browse-nav-buttons.html'">
          </div>

          <div class="searchBox"
               ng-include src="'app/browse/components/browse-search-box.html'">
          </div>

          <div class="clearfix"></div>
        </div>

      </div>

      <div class="body-content new-browse" ng-class="{ 'with-search-header': browse.isDedicatedSearchView }">

        <div id="browseTablesWrapper">

          <!-- Dedicated search page (/search): Volumio's own search box, carried by the shared head -->
          <aw-page-head variant="search" ng-if="browse.isDedicatedSearchView">
            <aw-head-nav>
              <div class="dedicated-search" ng-include src="'app/browse/components/browse-search-box.html'"></div>
            </aw-head-nav>
          </aw-page-head>

          <!-- the landing stays mounted while searching from its pill: results render below its header -->
          <div
              ng-if="!browse.browseService.isBrowsing"
              ng-include
              src="'app/themes/artwork/browse-music/components/aw-browse-home.html'">
          </div> <!-- /SOURCES PAGE -->


          <!-- ====== BROWSE ===== -->
          <!-- <div ng-if="browse.browseService.isBrowsing && !browse.browseService.isSearching"> -->

          <!-- Custom view headers -->
          <div class="aw-headwrap" ng-if="browse.browseService.info && !browse.hideInfoHeader">

            <!-- ====== ARTIST PAGE ===== -->
            <div
                ng-if="browse.browseService.info.type === 'artist'"
                ng-include
                src="'app/themes/artwork/browse-music/components/aw-artist-header.html'">
            </div> <!-- /ARTIST PAGE -->

            <!-- ====== ALBUM PAGE ===== -->
            <div
                ng-if="browse.browseService.info.type === 'album' || browse.browseService.info.type === 'song' || browse.isPlaylistInfo || browse.browseService.info.type === 'cd'"
                ng-include
                src="'app/themes/artwork/browse-music/components/aw-album-header.html'">
            </div> <!-- /ALBUM AND PLAYLIST PAGE -->

          </div>

          <!-- </div> --> <!-- /BROWSE -->

          <!-- Content -->

          <!-- Artwork list pages (mockup 2e Artists): back + breadcrumb, local filter, grid/list toggle -->
          <aw-page-head variant="list" on-back="browse.goBack()" ng-if="browse.isPlainList">
            <aw-head-nav>
              <aw-crumbs trail="browse.awCrumbs" current="browse.currentListTitle"
                         on-home="browse.backHome()" on-crumb="browse.awGoCrumb(crumb)"></aw-crumbs>
            </aw-head-nav>
            <aw-head-actions>
              <label class="aw-filter" ng-class="{'aw-filter--on': browse.awFilter.length}">
                <span class="material-symbols-rounded">search</span>
                <input type="search" ng-model="browse.awFilter" ng-change="browse.applyAwFilter()"
                       placeholder="Filter {{browse.currentListTitle | lowercase}}" aria-label="Filter {{browse.currentListTitle | lowercase}}">
              </label>
              <div class="aw-viewtoggle" ng-if="browse.browseService.showGridViewSelector" role="group" aria-label="View">
                <button type="button" ng-class="{active: browse.browseService.showGridView}" ng-click="browse.setGridView(true)" aria-label="Grid" title="Grid">
                  <span class="material-symbols-rounded">grid_view</span>
                </button>
                <button type="button" ng-class="{active: !browse.browseService.showGridView}" ng-click="browse.setGridView(false)" aria-label="List" title="List">
                  <span class="material-symbols-rounded">list</span>
                </button>
              </div>
            </aw-head-actions>
          </aw-page-head>

          <!-- title row: real name + count (filtered count while filtering) + sort order -->
          <div class="aw-listhead" ng-if="browse.isPlainList">
            <h1 class="aw-listhead__title">{{browse.currentListTitle}}</h1>
            <span class="aw-listhead__count mono" ng-if="browse.currentListCount">{{browse.awVisibleCount !== null ? browse.awVisibleCount + ' / ' : ''}}{{browse.currentListCount}}</span>
            <button type="button" class="aw-sort" ng-click="browse.toggleAwSort()" title="Sort order">
              <span class="aw-sort__k">Sort</span>
              <span class="aw-sort__v">{{browse.awSortDesc ? 'Z–A' : 'A–Z'}}</span>
              <span class="material-symbols-rounded">expand_more</span>
            </button>
          </div>

          <!-- artists list view: column header on the row grid (only the column we have data for) -->
          <div class="aw-cols aw-cols--artists mono" ng-if="browse.isPlainList && browse.currentUri === 'artists://' && !browse.browseService.showGridView" aria-hidden="true">
            <span></span><span>ARTIST</span><span></span>
          </div>

          <!-- Playlist: real column headers on the same grid as the rows (mockup 2d) -->
          <div class="aw-cols mono" ng-if="browse.isPlaylistInfo" aria-hidden="true">
            <span></span><span>#</span>
            <span class="aw-cols__info"><span>TITLE</span><span>ALBUM</span></span>
            <span></span><span></span>
          </div>

          <div id="browse-page"></div>

          <!-- alphabet rail: first letters of the real items; click scrolls to the first match -->
          <nav class="aw-alpha mono" ng-if="browse.isPlainList && browse.awLetters.length > 1" aria-label="Jump to letter">
            <button type="button" ng-repeat="l in browse.awLetters track by l" ng-click="browse.awJumpTo(l)"
                    ng-class="{active: l === browse.awActiveLetter}">{{l}}</button>
          </nav>

        </div>
      </div> <!-- /.body-content -->

    </div> <!-- /.panel -->

  </div> <!-- /#browse -->

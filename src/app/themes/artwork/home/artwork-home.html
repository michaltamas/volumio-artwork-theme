<!-- Artwork My Music / Library home (spec §6.2 + updated mockup) -->
<div id="artwork-home">

  <!-- tabs row -->
  <div class="home-tabs">
    <button type="button" class="aw-menu-btn" ng-click="home.awMenu.toggle()" aria-label="Menu" title="Menu"><span class="material-symbols-rounded">menu</span></button>
    <div class="home-tab active">Library</div>
    <!-- the other tabs are the real browse sources (streaming services, web radio) -->
    <div class="home-tab" ng-repeat="s in home.sources track by s.uri" ng-click="home.openSource(s)">{{s.name}}</div>
    <div class="home-search" ng-click="home.goSearch()" role="button" tabindex="0" ng-keydown="$event.key === 'Enter' && home.goSearch()">
      <span class="material-symbols-rounded">search</span>
      <span class="home-search-label">Search everything</span>
      <span class="home-search-key mono">⌘K</span>
    </div>
    <div class="home-avatar" ng-click="home.goTo('myvolumio')">
      <span class="material-symbols-rounded">person</span>
    </div>
  </div>

  <!-- continue / pick up where you left off -->
  <div class="home-hero" ng-if="home.hasContinue">
    <div class="home-hero-cover">
      <img ng-src="{{home.continueArt}}" alt="{{home.continueTitle}}">
    </div>
    <div class="home-hero-meta">
      <div class="home-eyebrow mono">PICK UP WHERE YOU LEFT OFF</div>
      <div class="home-hero-title">{{home.continueTitle}}</div>
      <div class="home-hero-actions">
        <button class="home-resume" ng-click="home.resume()">
          <span class="material-symbols-rounded">play_arrow</span>
          <span>Resume</span>
        </button>
        <span class="home-hero-sub" ng-if="home.continueArtist">{{home.continueArtist}}</span>
      </div>
    </div>
  </div>

  <!-- recent albums shelf -->
  <div class="home-shelf" ng-if="home.recentAlbums.length">
    <div class="home-shelf-head">
      <span class="mono home-shelf-title">RECENT ALBUMS</span>
      <!-- mockup: two 30px round arrows on the right; here they page through the real list -->
      <div class="home-shelf-nav" ng-if="home.shelfPages > 1">
        <button type="button" ng-click="home.shelfPrev()" ng-disabled="!home.canShelfPrev" aria-label="Previous"><span class="material-symbols-rounded">chevron_left</span></button>
        <button type="button" ng-click="home.shelfNext()" ng-disabled="!home.canShelfNext" aria-label="Next"><span class="material-symbols-rounded">chevron_right</span></button>
      </div>
    </div>
    <div class="main__row">
      <div class="music-card__wrapper" ng-repeat="album in home.shelfItems track by album.uri">
        <div class="music-card" ng-click="home.openAlbum(album)">
          <div class="music-card__header">
            <img class="music-card__img" ng-src="{{home.playerService.getAlbumart(album.albumart)}}" alt="" onerror="this.style.display='none'">
            <div class="music-card__overlay">
              <div class="meta__play">
                <button class="ghost-btn play-btn"><i class="fa fa-play play-btn__icon"></i></button>
              </div>
            </div>
          </div>
          <div class="music-card__info">
            <div class="music-card__label" title="{{album.title || album.album}}">{{album.title || album.album}}</div>
          </div>
          <p class="music-card__meta">{{album.artist || ''}}</p>
        </div>
      </div>
    </div>
  </div>

</div>

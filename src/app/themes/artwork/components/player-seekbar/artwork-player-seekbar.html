<!-- Artwork seek bar (mockup "2a 2b 2e"): elapsed · track with a handle · remaining / duration.
     The whole hit area scrubs by pointer and the arrow keys step through the track. -->
<div class="artwork-seek" ng-if="playerSeekBar.getDuration() != null">
  <span class="seek-time seek-elapsed mono">{{playerSeekBar.getElapsed()}}</span>
  <div class="artwork-seek__hit" role="slider" tabindex="0" aria-label="Seek"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{playerSeekBar.ariaNow()}}"
       ng-keydown="playerSeekBar.onKey($event)">
    <div class="seek-track">
      <div class="seek-fill" ng-style="{width: playerSeekBar.playedPct() + '%'}"></div>
      <div class="seek-handle" ng-style="{left: playerSeekBar.playedPct() + '%'}"></div>
    </div>
  </div>
  <span class="seek-time seek-remaining mono">-{{playerSeekBar.getRemaining()}}</span>
  <span class="seek-time seek-duration mono">{{playerSeekBar.getDuration()}}</span>
</div>

<!-- Artwork waveform scrubber (spec §5.7). Same controller as the stock seekbar;
     bars come from playerSeekBar.bars (seeded envelope), coloured by progress. -->
<div class="artwork-seek" ng-if="playerSeekBar.getDuration() != null">
  <div class="artwork-seek-times">
    <span class="mono">{{playerSeekBar.getElapsed()}}</span>
    <span class="mono">{{playerSeekBar.getDuration()}}</span>
  </div>
  <div class="artwork-wave" role="slider" tabindex="0" aria-label="Seek"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{playerSeekBar.ariaNow()}}"
       ng-keydown="playerSeekBar.onKey($event)">
    <div class="wave-bar"
         ng-repeat="h in playerSeekBar.bars track by $index"
         ng-class="{played: playerSeekBar.barPlayed($index)}"
         ng-style="{height: (h / 46 * 100) + '%'}"
         ng-click="playerSeekBar.seekToBar($index)"></div>
  </div>
</div>

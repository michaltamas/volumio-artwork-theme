<!-- Artwork sleep timer sheet (handoff 9a). Choosing: four presets, a custom length, what
     happens when it ends, Start. Running: the countdown, the progress, when it started and
     ends, and exactly one action — Turn off timer. The state comes from awSleep, shared with
     the tags on Now Playing and the mini player. -->
<div class="aw-sheet aw-sheet--sleep" ng-class="{'is-running': modal.sleep.running}">

  <div class="aw-sleep__head">
    <span class="material-symbols-rounded">bedtime</span>
    <span class="mono">SLEEP TIMER</span>
    <button type="button" class="aw-sheet__close" ng-click="modal.cancel()" aria-label="Close"><span class="material-symbols-rounded">close</span></button>
  </div>

  <!-- choosing -->
  <div class="aw-sleep__choose" ng-if="!modal.sleep.running">
    <div class="aw-sleep__grid" role="group" aria-label="Minutes">
      <button type="button" class="aw-sleep__preset mono" ng-repeat="m in modal.presets" ng-class="{active: modal.minutes === m && !modal.customOn}" ng-click="modal.pick(m)">{{m}}</button>
    </div>
    <div class="aw-sleep__unit mono">MINUTES</div>
    <label class="aw-sleep__custom" ng-class="{active: modal.customOn}">
      <span>Custom</span>
      <span class="aw-sleep__custom-val mono"><input type="text" inputmode="numeric" maxlength="3" ng-model="modal.custom" ng-change="modal.pickCustom()" placeholder="—" aria-label="Custom minutes"> MIN</span>
    </label>
    <div class="aw-sleep__rule"></div>
    <div class="aw-sleep__label">When it ends</div>
    <div class="aw-sleep__seg" role="group" aria-label="When it ends">
      <button type="button" ng-class="{active: modal.action === 'stop'}" ng-click="modal.action = 'stop'">Stop music</button>
      <button type="button" ng-class="{active: modal.action === 'poweroff'}" ng-click="modal.action = 'poweroff'">Power off</button>
    </div>
    <button type="button" class="aw-sleep__start" ng-click="modal.start()" ng-disabled="!modal.minutes">Start</button>
  </div>

  <!-- running -->
  <div class="aw-sleep__run" ng-if="modal.sleep.running">
    <div class="aw-sleep__count mono">{{modal.sleep.countdown}}</div>
    <div class="aw-sleep__then mono">REMAINING · THEN {{modal.sleep.action === 'poweroff' ? 'POWER OFF' : 'STOP MUSIC'}}</div>
    <div class="aw-sleep__bar"><div class="aw-sleep__bar-fill" ng-style="{width: modal.sleep.progress + '%'}"></div></div>
    <div class="aw-sleep__ends mono">
      <span ng-if="modal.sleep.startedText">STARTED {{modal.sleep.startedText}}</span><span ng-if="!modal.sleep.startedText"></span>
      <span>ENDS {{modal.sleep.endsText}}</span>
    </div>
    <button type="button" class="aw-sleep__off" ng-click="modal.off()">Turn off timer</button>
  </div>

</div>

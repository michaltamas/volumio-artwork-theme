<!-- Artwork icon rail (spec §5.1). Fixed 76px labelless nav.
     Uses ng-click -> $state.go (ui-sref does not navigate reliably inside this
     isolate-scope directive). Icons: Material Symbols Rounded (design mockup).
     Music sources live in the Library screen; reachable via the "browse" icon. -->
<div id="main-menu">

  <!-- brand → Library. ('redirect' is the app's entry route: it re-runs the boot
       path — splash with the record image, then a bounce — hence the flicker) -->
  <div class="brand" ng-click="mainMenu.$state.go('volumio.home')" role="link" tabindex="0" aria-label="Volumio">V</div>

  <ul class="main-menu-list">
    <li>
      <a ng-click="mainMenu.$state.go('volumio.home')" aria-label="Home" title="Home"
         ng-class="{active: mainMenu.$state.current.name === 'volumio.home'}">
        <span class="material-symbols-rounded">home</span>
      </a>
    </li>
    <li>
      <a ng-click="mainMenu.$state.go('volumio.browse')" aria-label="Music" title="Music"
         ng-class="{active: mainMenu.$state.current.name === 'volumio.browse' && !mainMenu.isSourceActive('playlists') && !mainMenu.isSourceActive('favourites')}">
        <span class="material-symbols-rounded">album</span>
      </a>
    </li>
    <!-- library sources straight from the rail (only when the backend lists them) -->
    <li ng-if="mainMenu.sourceByUri('playlists')">
      <a ng-click="mainMenu.goToSource('playlists')" aria-label="Playlists" title="Playlists"
         ng-class="{active: mainMenu.isSourceActive('playlists')}">
        <span class="material-symbols-rounded">playlist_play</span>
      </a>
    </li>
    <li ng-if="mainMenu.sourceByUri('favourites')">
      <a ng-click="mainMenu.goToSource('favourites')" aria-label="Favourites" title="Favourites"
         ng-class="{active: mainMenu.isSourceActive('favourites')}">
        <span class="material-symbols-rounded">favorite</span>
      </a>
    </li>
    <li>
      <a ng-click="mainMenu.$state.go('volumio.play-queue')" aria-label="Queue" title="Queue"
         ng-class="{active: mainMenu.$state.current.name === 'volumio.play-queue'}">
        <span class="material-symbols-rounded">queue_music</span>
      </a>
    </li>
  </ul>

  <ul class="main-menu-bottom">
    <li ng-if="mainMenu.isAuthActive()">
      <a ng-click="mainMenu.goToMyVolumio()" aria-label="MyVolumio" title="MyVolumio"
         ng-class="{active: mainMenu.$state.current.name.indexOf('myvolumio') === 0}">
        <span class="material-symbols-rounded">person</span>
      </a>
    </li>
    <li>
      <a ng-click="mainMenu.$state.go('volumio.multi-room')" aria-label="Zones" title="Zones"
         ng-class="{active: mainMenu.$state.current.name === 'volumio.multi-room'}">
        <span class="material-symbols-rounded">speaker</span>
      </a>
    </li>
    <li>
      <a ng-click="mainMenu.$state.go('volumio.settings')" aria-label="Settings" title="Settings"
         ng-class="{active: mainMenu.$state.current.name === 'volumio.settings'}">
        <span class="material-symbols-rounded">tune</span>
      </a>
    </li>
  </ul>

</div>

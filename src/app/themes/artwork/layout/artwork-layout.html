<!-- NOTE: MOVE HERE THE BACKGROUND IF POSSIBLE -->

<!-- iOS 26 Safari colours its status bar from the background-color of a real fixed element at the
     top edge (≥3px high, ≥80% wide; pseudo-elements and blurred elements are ignored) — this strip
     carries the mini player's colour (--aw-band, per cover); shown on phones only -->
<div class="aw-band" aria-hidden="true"></div>

<!-- Artwork Is The Interface: full-frame blurred cover behind every screen (spec §4) -->
<div class="art-stack" aria-hidden="true">
  <img class="art-bg"
       ng-if="layout.playerService.state.albumart"
       ng-src="{{ layout.playerService.albumart }}" alt="">
  <div class="art-scrim"></div>
</div>

<wait-backend-scrim></wait-backend-scrim>
<div id="wizardScrim"></div>

<!-- the appearance switch moves itself under the interface picker on the System page -->
<aw-appearance-slot></aw-appearance-slot>

<div id="layout-container" class="container-fluid">

      <!--
      <header id="header" ui-view="header"></header>
      -->

      <div
        class="row main-container"
        ng-class="[ state.current.url, layout.isWithPlaybackBar ? 'with-playback-bar' : '' ]"
      >

          <main-menu id="main-menu-container"></main-menu>
    
          <div id="contentWrapper"
            ng-class="[ state.current.url, 'aw-state-' + state.current.name.replace('.', '-'), layout.isSettingsShell ? 'aw-settings-shell' : '', (layout.isSettingsShell && !layout.awSettings.hasSide) ? 'aw-settings-shell--noside' : '' ]"
            hm-swipeleft="layout.swipeLeft($event)"
            hm-swiperight="layout.swipeRight($event)"
            hm-recognizer-options='[{"directions":"DIRECTION_LEFT|DIRECTION_RIGHT", "threshold": 50}]'
          >

            <!--
            <div class='content-top-bar'>
                <on-cloud-actions></on-cloud-actions>
            </div>
            -->
    
            <!-- Artwork settings shell: real menu on the left, data widgets on the right -->
            <aw-settings-nav ng-if="layout.isSettingsShell"></aw-settings-nav>

            <!-- phone: MyVolumio pages use Volumio's own templates (no head to put the menu in) -->
            <button type="button" class="aw-menu-btn aw-menu-btn--float" ng-if="layout.floatMenu" ng-click="layout.awMenu.toggle()" aria-label="Menu" title="Menu"><span class="material-symbols-rounded">menu</span></button>
            <div id="content"
                ng-class="state.current.url"
                ui-view="content">
            </div>

            <aw-settings-side ng-if="layout.isSettingsShell"></aw-settings-side>

          </div>

      </div>

      <!-- Artwork: floating queue sheet (toggled from the rail, the mini player and Now Playing) -->
      <aw-queue-panel></aw-queue-panel>
      <!-- Artwork phone layout: the rail's replacement -->
      <aw-mobile-menu></aw-mobile-menu>

      <footer id="footer-container" 
        ui-view="footer">
      </footer>

</div>

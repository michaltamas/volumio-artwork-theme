<div ng-if="footer.isSocketReady" id="footer-content">
  <div id="player-bar" ng-class="{'playback-bar': footer.showPlayerFooter}">

    <!-- desktop mini player (spec §5.10 / mockup) -->
    <div class="artwork-mini hidden-xs hidden-sm">

      <div class="mini-identity">
        <track-info is-in-footer="true"></track-info>
      </div>

      <div class="mini-transport">
        <player-buttons is-in-footer="true"></player-buttons>
      </div>

      <div class="mini-right">
        <div class="mini-volume">
          <volume-manager is-on-footer="true"></volume-manager>
        </div>
        <button id="openMenuBtn" class="mini-zone"
                ng-click="audioOutputs.toggleMenu()"
                title="{{'MULTIDEVICE.ZONES_AND_OUTPUTS' | translate}}">
          <span class="material-symbols-rounded">speaker</span>
          <span class="mini-zone-name">{{ footer.zoneName || 'This player' }}</span>
        </button>
        <button ui-sref="volumio.play-queue"
                class="btn btn-link mini-queue"
                ng-class="{selected: footer.state.current.name === 'volumio.play-queue'}"
                title="{{'COMMON.TAB_QUEUE' | translate}}">
          <span class="material-symbols-rounded">queue_music</span>
        </button>
      </div>

      <div class="mini-wave">
        <player-seekbar></player-seekbar>
      </div>

    </div>

    <!-- mobile -->
    <div class="artwork-mini-mobile visible-xs visible-sm">
      <div class="lined-seekbar"><player-seekbar></player-seekbar></div>
      <div class="mobile-row">
        <div class="track-info-container"><track-info is-in-footer="true"></track-info></div>
        <div class="controls-container"><player-buttons is-in-footer="true"></player-buttons></div>
      </div>
      <ng-include id="tab-bar" src="'app/themes/artwork/partials/artwork-tab-bar.html'"></ng-include>
    </div>

  </div>
</div>

<audio-outputs class="zoneBtn"></audio-outputs>
